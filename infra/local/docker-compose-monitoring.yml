services:
  prometheus:
    image: prom/prometheus:latest
    container_name: league-of-star-prometheus
    networks:
      - league-of-star-local
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: league-of-star-grafana
    networks:
      - league-of-star-local
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:

networks:
  league-of-star-local:
    external: true
