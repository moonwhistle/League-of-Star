services:
  league-of-star-api-1:
    image: league-of-star-nginx-routing-mock:local
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    hostname: api-1
    networks:
      - nginx-routing-test

  league-of-star-api-2:
    image: league-of-star-nginx-routing-mock:local
    build:
      context: .
      dockerfile: Dockerfile.mock-api
    hostname: api-2
    networks:
      - nginx-routing-test

  nginx:
    build:
      context: ..
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - league-of-star-api-1
      - league-of-star-api-2
    networks:
      - nginx-routing-test

networks:
  nginx-routing-test:
