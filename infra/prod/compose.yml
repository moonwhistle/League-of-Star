name: league-of-star-prod

x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: 8080
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ACCESS_TOKEN_EXPIRATION_MS: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:-3600000}
  JWT_REFRESH_TOKEN_EXPIRATION_MS: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:-604800000}
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}/login/oauth2/code/google
  SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  SPRING_MAIL_PORT: ${MAIL_PORT:-587}
  SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
  SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
  OAUTH2_SUCCESS_REDIRECT_URL: ${FRONTEND_URL:?FRONTEND_URL is required}/oauth2/redirect
  APP_PASSWORD_RESET_FRONTEND_RESET_URL: ${FRONTEND_URL:?FRONTEND_URL is required}/password/reset
  APP_CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:?FRONTEND_URL is required}
  APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${FRONTEND_URL:?FRONTEND_URL is required}
  TZ: Asia/Seoul

x-app-common: &app-common
  image: league-of-star-api:prod
  build:
    context: ../../backend
    dockerfile: league-of-star-api/Dockerfile
  restart: unless-stopped
  depends_on:
    nginx:
      condition: service_healthy
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  expose:
    - "8080"
  networks:
    - league-of-star-prod
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - league-of-star-prod
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - league-of-star-prod
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - league-of-star-prod
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  league-of-star-api-1:
    <<: *app-common
    environment:
      <<: *app-environment
      MATCHING_STREAM_CONSUMER_NAME: api-1

  league-of-star-api-2:
    <<: *app-common
    environment:
      <<: *app-environment
      MATCHING_STREAM_CONSUMER_NAME: api-2

volumes:
  mysql-data:
  redis-data:

networks:
  league-of-star-prod:
    name: league-of-star-prod
