spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "dummy-client-id"
            client-secret: "dummy-client-secret"
  data:
    redis:
      timeout: 2000
  mail:
    host: localhost
    port: 587
    username: dummy
    password: dummy
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
# Redis Host/Port는 AbstractRedisTest의 DynamicPropertySource에서 동적으로 주입됩니다.

jwt:
  secret: "v-very-important-and-very-long-dummy-secret-key-for-test-environments-only"
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 604800000

oauth2:
  success-redirect-url: "http://localhost:3000/oauth2/redirect"


