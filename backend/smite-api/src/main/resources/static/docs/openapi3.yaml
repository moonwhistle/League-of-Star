openapi: 3.0.1
info:
  title: League of Smite API
  description: League of Smite API 명세서
  version: 1.0.0
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 일반 로그인
      description: 이메일과 비밀번호로 로그인하여 토큰을 발급받습니다.
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-login-2103469501'
            examples:
              auth-login:
                value: "{\n  \"email\" : \"test@example.com\",\n  \"password\" : \"\
                  password123\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-login1260122497'
              examples:
                auth-login:
                  value: "{\n  \"accessToken\" : \"access-token\",\n  \"refreshToken\"\
                    \ : \"refresh-token\",\n  \"userId\" : 1,\n  \"nickname\" : \"\
                    테스터\"\n}"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 리프레시 토큰을 무효화하여 로그아웃 처리합니다.
      operationId: auth-logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-logout392386629'
            examples:
              auth-logout:
                value: "{\n  \"refreshToken\" : \"refresh-token-to-delete\"\n}"
      responses:
        "200":
          description: "200"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      description: 리프레시 토큰을 사용하여 새로운 토큰 쌍을 발급받습니다.
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-refresh132229249'
            examples:
              auth-refresh:
                value: "{\n  \"refreshToken\" : \"old-refresh-token\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-refresh1249058254'
              examples:
                auth-refresh:
                  value: "{\n  \"accessToken\" : \"new-access-token\",\n  \"refreshToken\"\
                    \ : \"new-refresh-token\"\n}"
  /api/v1/auth/signUp:
    post:
      tags:
      - Auth
      summary: 일반 회원가입
      description: 이메일과 비밀번호를 사용하여 회원가입을 진행합니다.
      operationId: auth-signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-signUp1187183266'
            examples:
              auth-signup:
                value: "{\n  \"email\" : \"test@example.com\",\n  \"password\" : \"\
                  password123\",\n  \"nickname\" : \"테스터\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-signUp-590972362'
              examples:
                auth-signup:
                  value: "{\n  \"id\" : 1,\n  \"email\" : \"test@example.com\",\n\
                    \  \"nickname\" : \"테스터\"\n}"
  /api/v1/match/join:
    post:
      tags:
      - Match
      summary: 매칭 대기열 진입
      description: 사용자가 매칭 대기열에 진입합니다.
      operationId: match-join
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
  /api/v1/match/leave:
    delete:
      tags:
      - Match
      summary: 매칭 대기열 취소
      description: 사용자가 매칭 대기열에서 나갑니다.
      operationId: match-leave
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
  /api/v1/auth/password/reset-request:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 링크 요청
      description: 가입된 이메일로 비밀번호 재설정 링크를 발송합니다. (현재는 서버 로그로 확인)
      operationId: auth-password-reset-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-password-reset-request-1598584392'
            examples:
              auth-password-reset-request:
                value: "{\n  \"email\" : \"test@example.com\"\n}"
      responses:
        "200":
          description: "200"
          content:
            text/plain;charset=ISO-8859-1:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit486549215'
              examples:
                auth-password-reset-request:
                  value: "??? ??? ???? ???????. (Mock: ?? ?? ??)"
  /api/v1/auth/password/reset-submit:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 제출
      description: 토큰과 새 비밀번호를 사용하여 비밀번호를 변경합니다.
      operationId: auth-password-reset-submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-password-reset-submit1164788574'
            examples:
              auth-password-reset-submit:
                value: "{\n  \"token\" : \"valid-token\",\n  \"newPassword\" : \"\
                  newPassword123\"\n}"
      responses:
        "200":
          description: "200"
          content:
            text/plain;charset=ISO-8859-1:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit486549215'
              examples:
                auth-password-reset-submit:
                  value: ????? ????? ???????.
components:
  schemas:
    api-v1-auth-signUp1187183266:
      required:
      - email
      - nickname
      - password
      type: object
      properties:
        password:
          type: string
          description: 비밀번호 (8~20자)
        nickname:
          type: string
          description: 닉네임 (2~16자)
        email:
          type: string
          description: 사용자 이메일
    api-v1-auth-signUp-590972362:
      required:
      - email
      - id
      - nickname
      type: object
      properties:
        nickname:
          type: string
          description: 가입된 닉네임
        id:
          type: number
          description: 생성된 사용자 ID
        email:
          type: string
          description: 가입된 이메일
    api-v1-auth-refresh132229249:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          description: 기존 리프레시 토큰
    api-v1-auth-password-reset-submit1164788574:
      required:
      - newPassword
      - token
      type: object
      properties:
        newPassword:
          type: string
          description: 새 비밀번호 (영문+숫자 8자 이상)
        token:
          type: string
          description: 재설정 토큰
    api-v1-auth-logout392386629:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          description: 무효화할 리프레시 토큰
    api-v1-auth-login1260122497:
      required:
      - accessToken
      - nickname
      - refreshToken
      - userId
      type: object
      properties:
        nickname:
          type: string
          description: 사용자 닉네임
        accessToken:
          type: string
          description: 액세스 토큰
        userId:
          type: number
          description: 사용자 ID
        refreshToken:
          type: string
          description: 리프레시 토큰
    api-v1-auth-login-2103469501:
      required:
      - email
      - password
      type: object
      properties:
        password:
          type: string
          description: 비밀번호
        email:
          type: string
          description: 사용자 이메일
    api-v1-auth-refresh1249058254:
      required:
      - accessToken
      - refreshToken
      type: object
      properties:
        accessToken:
          type: string
          description: 새로운 액세스 토큰
        refreshToken:
          type: string
          description: 새로운 리프레시 토큰 (Rotation 적용)
    api-v1-auth-password-reset-submit486549215:
      type: object
    api-v1-auth-password-reset-request-1598584392:
      required:
      - email
      type: object
      properties:
        email:
          type: string
          description: 사용자 이메일
