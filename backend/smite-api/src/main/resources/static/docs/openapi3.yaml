openapi: 3.0.1
info:
  title: League of Smite API
  description: League of Smite API 명세서
  version: 1.0.0
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 일반 로그인
      description: 이메일과 비밀번호로 로그인하여 토큰을 발급받습니다.
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-login-2103469501'
            examples:
              auth-login:
                value: "{\n  \"email\" : \"test@example.com\",\n  \"password\" : \"\
                  password123\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-login1260122497'
              examples:
                auth-login:
                  value: "{\n  \"accessToken\" : \"access-token\",\n  \"refreshToken\"\
                    \ : \"refresh-token\",\n  \"userId\" : 1,\n  \"nickname\" : \"\
                    테스터\"\n}"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 리프레시 토큰을 무효화하여 로그아웃 처리합니다.
      operationId: auth-logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-logout392386629'
            examples:
              auth-logout:
                value: "{\n  \"refreshToken\" : \"refresh-token-to-delete\"\n}"
      responses:
        "200":
          description: "200"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      description: 리프레시 토큰을 사용하여 새로운 토큰 쌍을 발급받습니다.
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-refresh132229249'
            examples:
              auth-refresh:
                value: "{\n  \"refreshToken\" : \"old-refresh-token\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-refresh1249058254'
              examples:
                auth-refresh:
                  value: "{\n  \"accessToken\" : \"new-access-token\",\n  \"refreshToken\"\
                    \ : \"new-refresh-token\"\n}"
  /api/v1/auth/signUp:
    post:
      tags:
      - Auth
      summary: 일반 회원가입
      description: 이메일과 비밀번호를 사용하여 회원가입을 진행합니다.
      operationId: auth-signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-signUp1187183266'
            examples:
              auth-signup:
                value: "{\n  \"email\" : \"test@example.com\",\n  \"password\" : \"\
                  password123\",\n  \"nickname\" : \"테스터\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-signUp-590972362'
              examples:
                auth-signup:
                  value: "{\n  \"id\" : 1,\n  \"email\" : \"test@example.com\",\n\
                    \  \"nickname\" : \"테스터\"\n}"
  /api/v1/match/join:
    post:
      tags:
      - Match
      summary: 매칭 대기열 진입
      description: 사용자가 매칭 대기열에 진입합니다.
      operationId: match-join
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
  /api/v1/match/leave:
    delete:
      tags:
      - Match
      summary: 매칭 대기열 취소
      description: 사용자가 매칭 대기열에서 나갑니다.
      operationId: match-leave
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
  /api/v1/auth/password/reset-request:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 링크 요청
      description: 가입된 이메일로 비밀번호 재설정 링크를 발송합니다. (현재는 서버 로그로 확인)
      operationId: auth-password-reset-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-password-reset-request-1598584392'
            examples:
              auth-password-reset-request:
                value: "{\n  \"email\" : \"test@example.com\"\n}"
      responses:
        "200":
          description: "200"
          content:
            text/plain;charset=ISO-8859-1:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit486549215'
              examples:
                auth-password-reset-request:
                  value: "??? ??? ???? ???????. (Mock: ?? ?? ??)"
  /api/v1/auth/password/reset-submit:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 제출
      description: 토큰과 새 비밀번호를 사용하여 비밀번호를 변경합니다.
      operationId: auth-password-reset-submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-password-reset-submit1164788574'
            examples:
              auth-password-reset-submit:
                value: "{\n  \"token\" : \"valid-token\",\n  \"newPassword\" : \"\
                  newPassword123\"\n}"
      responses:
        "200":
          description: "200"
          content:
            text/plain;charset=ISO-8859-1:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit486549215'
              examples:
                auth-password-reset-submit:
                  value: ????? ????? ???????.
  /api/v1/games/{gameId}/summary:
    get:
      tags:
      - Game
      summary: 게임 결과 summary 조회 - PENDING
      description: "`GAME_RESULT` WebSocket 수신 후 최종 결과 화면에서 호출하는 조회 API입니다.\n\ngameRoom은\
        \ `FINISHED`지만 record/rank 정산 record가 아직 0행 또는 1행이면 `PENDING`을 반환합니다.\n서버는\
        \ 이 API에서 정산을 새로 수행하지 않고, 클라이언트는 `retryAfterMillis` 기준으로 짧게 polling합니다.\n"
      operationId: game-summary-
      parameters:
      - name: gameId
        in: path
        description: 게임 ID. 현재 구현에서는 gameRoomId와 동일
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary104297999'
              examples:
                game-summary-pending:
                  value: "{\n  \"summaryStatus\" : \"PENDING\",\n  \"gameId\" : 100,\n\
                    \  \"retryAfterMillis\" : 1000\n}"
                game-summary-done:
                  value: "{\n  \"summaryStatus\" : \"DONE\",\n  \"gameId\" : 100,\n\
                    \  \"gameResult\" : \"PLAYER1_WIN\",\n  \"winnerUserId\" : 1,\n\
                    \  \"finishedAt\" : \"2026-05-27T12:34:56\",\n  \"me\" : {\n \
                    \   \"userId\" : 1,\n    \"nickname\" : \"moon\",\n    \"result\"\
                    \ : \"WIN\",\n    \"lpBefore\" : 40,\n    \"lpAfter\" : 56,\n\
                    \    \"lpChange\" : 16,\n    \"rankBefore\" : \"GOLD_IV\",\n \
                    \   \"rankAfter\" : \"GOLD_III\",\n    \"seriesType\" : \"RANK\"\
                    ,\n    \"rankSeriesId\" : null\n  },\n  \"opponent\" : {\n   \
                    \ \"userId\" : 2,\n    \"nickname\" : \"other\",\n    \"result\"\
                    \ : \"LOSS\",\n    \"lpBefore\" : 61,\n    \"lpAfter\" : 45,\n\
                    \    \"lpChange\" : -16,\n    \"rankBefore\" : \"GOLD_IV\",\n\
                    \    \"rankAfter\" : \"GOLD_IV\",\n    \"seriesType\" : \"RANK\"\
                    ,\n    \"rankSeriesId\" : null\n  }\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary2042838415'
              examples:
                game-summary-not-found:
                  value: "{\n  \"timestamp\" : [ 2026, 5, 29, 10, 30, 41, 802813000\
                    \ ],\n  \"status\" : 404,\n  \"code\" : \"GAME_005\",\n  \"message\"\
                    \ : \"게임방을 찾을 수 없습니다.\",\n  \"errors\" : null\n}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary2042838415'
              examples:
                game-summary-not-finished:
                  value: "{\n  \"timestamp\" : [ 2026, 5, 29, 10, 30, 41, 876084000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"GAME_SUMMARY_001\",\n\
                    \  \"message\" : \"종료된 게임의 결과만 조회할 수 있습니다.\",\n  \"errors\" :\
                    \ null\n}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary2042838415'
              examples:
                game-summary-forbidden:
                  value: "{\n  \"timestamp\" : [ 2026, 5, 29, 10, 30, 41, 847750000\
                    \ ],\n  \"status\" : 403,\n  \"code\" : \"AUTH_002\",\n  \"message\"\
                    \ : \"해당 리소스에 대한 접근 권한이 없습니다.\",\n  \"errors\" : null\n}"
  /api/v1/match/{matchId}/accept:
    post:
      tags:
      - Match
      summary: 매칭 수락 실패
      description: "매칭 수락 요청이 이미 완료/거절/timeout된 세션에 도착한 경우 기존 전역 `ErrorResponse`를\
        \ 반환합니다.\n실패 응답은 최종 정산 이벤트가 아니며, `MATCH_012` lock 실패만 모달 유지 후 SSE 최종 결과 대기\
        로 처리합니다.\n그 외 매칭 응답 실패는 start 버튼 화면 복귀 기준으로 처리합니다.\n\n주요 실패 코드:\n- `MATCH_006`:\
        \ 세션 없음 또는 만료\n- `MATCH_007`: 세션 참여자 아님\n- `MATCH_008`: 이미 수락한 유저가 거절 시도\n\
        - `MATCH_009`: 이미 완료된 세션\n- `MATCH_010`: 이미 거절된 세션\n- `MATCH_011`: 이미 timeout\
        \ 정산된 세션\n- `MATCH_012`: 같은 matchId 응답 처리 중\n"
      operationId: match-accept
      parameters:
      - name: matchId
        in: path
        description: 매칭 세션 ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary2042838415'
              examples:
                match-accept-failure:
                  value: "{\n  \"timestamp\" : [ 2026, 5, 29, 10, 30, 44, 60907000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"MATCH_011\",\n  \"message\"\
                    \ : \"이미 응답 시간이 초과된 매칭입니다.\",\n  \"errors\" : null\n}"
        "200":
          description: "200"
  /api/v1/match/{matchId}/reject:
    post:
      tags:
      - Match
      summary: 매칭 거절
      description: "매칭 성사 후 제한 시간 안에 매칭을 거절합니다.\n\n성공 응답은 `200 OK` empty body이며, 사\
        용자의 거절 요청이 서버에 반영되었다는 command ack만 의미합니다.\n한쪽이 먼저 거절해도 상대방의 응답 윈도우는 유지되고,\
        \ 거절한 유저도 최종 `match_response_result` SSE 이벤트를 기다립니다.\n"
      operationId: match-reject
      parameters:
      - name: matchId
        in: path
        description: 매칭 세션 ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary2042838415'
              examples:
                match-reject-failure:
                  value: "{\n  \"timestamp\" : [ 2026, 5, 29, 10, 30, 44, 25564000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"MATCH_008\",\n  \"message\"\
                    \ : \"이미 수락한 매칭입니다.\",\n  \"errors\" : null\n}"
  /api/v1/notifications/match/stream:
    get:
      tags:
      - Notification
      summary: 매칭 알림 SSE 연결
      description: "매칭 대기 화면에서 매칭 성사와 매칭 응답 최종 결과를 받기 위한 SSE 스트림을 연결합니다.\n\n클라이언트는\
        \ 매칭 시작 화면 진입 시 SSE를 연결하고, `match_found` 수신 후에도 같은 연결을 유지합니다.\naccept/reject\
        \ HTTP 응답은 command ack만 의미하며, 최종 화면 전환은 `match_response_result` 이벤트를 기준으로\
        \ 처리합니다.\n\n## event: match_found\n\n매칭이 성사되어 수락/거절 모달을 띄워야 할 때 전송합니다.\n\n\
        ## event: match_response_result\n\nmatchId 단위 최종 결과 이벤트입니다. 상대의 개별 응답 로그가\
        \ 아니라 최종 성공/실패 결과만 전달합니다.\n\nPayload:\n- `matchId`: 매칭 세션 ID\n- `outcome`:\
        \ `MATCHED`, `FAILED`\n- `reason`: `BOTH_ACCEPTED`, `MY_REJECTED`, `OPPONENT_REJECTED`,\
        \ `MY_TIMEOUT`, `OPPONENT_TIMEOUT`, `BOTH_TIMEOUT`, `GAME_SETUP_FAILED`\n\
        - `action`: `GO_TO_GAME_WAITING`, `GO_TO_MATCH_START`, `RETURN_TO_MATCHING`\n\
        - `opponent`: 상대 `userId`, `nickname`, `tier`, `tierScore`\n- `game`: 성공 시\
        \ 게임 대기 화면 진입 payload, 실패 시 `null`\n- `game.gameRoomId`: 생성된 게임방 ID\n- `game.videoUrl`:\
        \ 공통 MP4 static resource URL. MVP 기본값은 `/assets/game/dragon-view.mp4`\n- `game.webSocketUrl`:\
        \ gameRoom WebSocket URL. MVP 기본 형식은 `/ws/game/{gameRoomId}`\n\nAction mapping:\n\
        - `GO_TO_GAME_WAITING`: `game` payload를 사용해 게임 진행 대기 화면으로 이동\n- `GO_TO_MATCH_START`:\
        \ 매칭 start 버튼 화면으로 복귀\n- `RETURN_TO_MATCHING`: 기존 우선순위로 매칭 대기 상태 복귀\n\nResult\
        \ mapping:\n- `MATCHED / BOTH_ACCEPTED / GO_TO_GAME_WAITING / game={gameRoomId,\
        \ videoUrl, webSocketUrl}`\n- `FAILED / MY_REJECTED / GO_TO_MATCH_START`\n\
        - `FAILED / OPPONENT_REJECTED / RETURN_TO_MATCHING`\n- `FAILED / MY_TIMEOUT\
        \ / GO_TO_MATCH_START`\n- `FAILED / OPPONENT_TIMEOUT / RETURN_TO_MATCHING`\n\
        - `FAILED / BOTH_TIMEOUT / GO_TO_MATCH_START`\n- `FAILED / GAME_SETUP_FAILED\
        \ / GO_TO_MATCH_START`\n"
      operationId: notification-match-stream
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
components:
  schemas:
    api-v1-auth-signUp1187183266:
      required:
      - email
      - nickname
      - password
      type: object
      properties:
        password:
          type: string
          description: 비밀번호 (8~20자)
        nickname:
          type: string
          description: 닉네임 (2~16자)
        email:
          type: string
          description: 사용자 이메일
    api-v1-auth-signUp-590972362:
      required:
      - email
      - id
      - nickname
      type: object
      properties:
        nickname:
          type: string
          description: 가입된 닉네임
        id:
          type: number
          description: 생성된 사용자 ID
        email:
          type: string
          description: 가입된 이메일
    api-v1-auth-refresh132229249:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          description: 기존 리프레시 토큰
    api-v1-auth-password-reset-submit1164788574:
      required:
      - newPassword
      - token
      type: object
      properties:
        newPassword:
          type: string
          description: 새 비밀번호 (영문+숫자 8자 이상)
        token:
          type: string
          description: 재설정 토큰
    api-v1-auth-logout392386629:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
          description: 무효화할 리프레시 토큰
    api-v1-games-gameId-summary104297999:
      required:
      - finishedAt
      - gameId
      - gameResult
      - retryAfterMillis
      - summaryStatus
      - winnerUserId
      type: object
      properties:
        gameId:
          type: number
          description: 게임 ID
        winnerUserId:
          type: object
          description: 승자 userId. 무승부면 null
        summaryStatus:
          type: string
          description: summary 조회 상태. `DONE`
        retryAfterMillis:
          type: number
          description: 클라이언트 재조회 권장 대기 시간(ms)
        opponent:
          required:
          - lpAfter
          - lpBefore
          - lpChange
          - nickname
          - rankAfter
          - rankBefore
          - rankSeriesId
          - result
          - seriesType
          - userId
          type: object
          properties:
            lpChange:
              type: number
              description: 상대 LP 변화량
            result:
              type: string
              description: 상대 결과 enum 문자열
            rankAfter:
              type: string
              description: 상대 정산 후 rank 문자열
            seriesType:
              type: string
              description: 상대 정산 시리즈 타입 enum 문자열
            rankBefore:
              type: string
              description: 상대 정산 전 rank 문자열
            nickname:
              type: string
              description: 상대 닉네임
            lpAfter:
              type: number
              description: 상대 정산 후 LP
            lpBefore:
              type: number
              description: 상대 정산 전 LP
            rankSeriesId:
              type: object
              description: "일반 랭크 게임이면 null, 배치/승급전이면 series id"
            userId:
              type: number
              description: 상대 userId
        me:
          required:
          - lpAfter
          - lpBefore
          - lpChange
          - nickname
          - rankAfter
          - rankBefore
          - rankSeriesId
          - result
          - seriesType
          - userId
          type: object
          properties:
            lpChange:
              type: number
              description: 서버가 record 생성 시 저장한 LP 변화량
            result:
              type: string
              description: 내 결과 enum 문자열
            rankAfter:
              type: string
              description: 정산 후 rank 문자열
            seriesType:
              type: string
              description: 정산 시리즈 타입 enum 문자열
            rankBefore:
              type: string
              description: 정산 전 rank 문자열
            nickname:
              type: string
              description: 내 닉네임
            lpAfter:
              type: number
              description: 정산 후 LP
            lpBefore:
              type: number
              description: 정산 전 LP
            rankSeriesId:
              type: object
