openapi: 3.0.1
info:
  title: League of Star API
  description: League of Star API 명세서
  version: 1.0.0
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/rankings:
    get:
      tags:
      - Ranking
      summary: 랭킹 조회 실패 - 랭크 없음
      description: 인증된 userId에 해당하는 rank row가 없으면 전역 `ErrorResponse` 형식으로 `RANK_001`을
        반환합니다.
      operationId: ranking-list
      parameters:
      - name: limit
        in: query
        description: "조회할 상위 랭커 수. 기본값 5, 허용 범위 1~50"
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-users-me-game-records1374840482'
              examples:
                ranking-list-rank-not-found:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 17, 143765000\
                    \ ],\n  \"status\" : 404,\n  \"code\" : \"RANK_001\",\n  \"message\"\
                    \ : \"유저의 랭크 정보를 찾을 수 없습니다.\",\n  \"errors\" : null\n}"
                ranking-list-user-not-found:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 17, 153672000\
                    \ ],\n  \"status\" : 404,\n  \"code\" : \"USER_001\",\n  \"message\"\
                    \ : \"해당 유저를 찾을 수 없습니다.\",\n  \"errors\" : null\n}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-rankings564766604'
              examples:
                ranking-list-invalid-limit:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 17, 132381000\
                    \ ],\n  \"status\" : 400,\n  \"code\" : \"COMMON_003\",\n  \"\
                    message\" : \"입력값이 유효하지 않습니다\",\n  \"errors\" : null\n}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-rankings1288202534'
              examples:
                ranking-list:
                  value: "{\n  \"summary\" : {\n    \"myRankPosition\" : 12,\n   \
                    \ \"topPercent\" : 8,\n    \"totalRankers\" : 150\n  },\n  \"\
                    entries\" : [ {\n    \"rankPosition\" : 1,\n    \"userId\" : 2,\n\
                    \    \"nickname\" : \"LegendaryStar\",\n    \"tier\" : \"GOLD\"\
                    ,\n    \"division\" : \"IV\",\n    \"rank\" : \"GOLD_IV\",\n \
                    \   \"lp\" : 90,\n    \"tierScore\" : 13,\n    \"wins\" : 20,\n\
                    \    \"losses\" : 3,\n    \"draws\" : 1,\n    \"isCurrentUser\"\
                    \ : false\n  }, {\n    \"rankPosition\" : 2,\n    \"userId\" :\
                    \ 3,\n    \"nickname\" : \"ShadowWalker\",\n    \"tier\" : \"\
                    GOLD\",\n    \"division\" : \"IV\",\n    \"rank\" : \"GOLD_IV\"\
                    ,\n    \"lp\" : 80,\n    \"tierScore\" : 13,\n    \"wins\" : 18,\n\
                    \    \"losses\" : 4,\n    \"draws\" : 0,\n    \"isCurrentUser\"\
                    \ : false\n  } ],\n  \"currentUser\" : {\n    \"rankPosition\"\
                    \ : 12,\n    \"userId\" : 1,\n    \"nickname\" : \"Me\",\n   \
                    \ \"tier\" : \"SILVER\",\n    \"division\" : \"I\",\n    \"rank\"\
                    \ : \"SILVER_I\",\n    \"lp\" : 40,\n    \"tierScore\" : 12,\n\
                    \    \"wins\" : 10,\n    \"losses\" : 8,\n    \"draws\" : 2,\n\
                    \    \"isCurrentUser\" : true\n  }\n}"
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 일반 로그인
      description: 이메일과 비밀번호로 로그인하여 토큰을 발급받습니다.
      operationId: auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-login-2103469501'
            examples:
              auth-login:
                value: "{\n  \"email\" : \"test@example.com\",\n  \"password\" : \"\
                  password123\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-login1260122497'
              examples:
                auth-login:
                  value: "{\n  \"accessToken\" : \"access-token\",\n  \"refreshToken\"\
                    \ : \"refresh-token\",\n  \"userId\" : 1,\n  \"nickname\" : \"\
                    테스터\"\n}"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 리프레시 토큰을 무효화하여 로그아웃 처리합니다.
      operationId: auth-logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-logout392386629'
            examples:
              auth-logout:
                value: "{\n  \"refreshToken\" : \"refresh-token-to-delete\"\n}"
      responses:
        "200":
          description: "200"
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      description: 리프레시 토큰을 사용하여 새로운 토큰 쌍을 발급받습니다.
      operationId: auth-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-refresh132229249'
            examples:
              auth-refresh:
                value: "{\n  \"refreshToken\" : \"old-refresh-token\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-refresh1249058254'
              examples:
                auth-refresh:
                  value: "{\n  \"accessToken\" : \"new-access-token\",\n  \"refreshToken\"\
                    \ : \"new-refresh-token\"\n}"
  /api/v1/auth/signUp:
    post:
      tags:
      - Auth
      summary: 일반 회원가입
      description: 이메일과 비밀번호를 사용하여 회원가입을 진행합니다.
      operationId: auth-signup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-signUp1187183266'
            examples:
              auth-signup:
                value: "{\n  \"email\" : \"test@example.com\",\n  \"password\" : \"\
                  password123\",\n  \"nickname\" : \"테스터\"\n}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-signUp-590972362'
              examples:
                auth-signup:
                  value: "{\n  \"id\" : 1,\n  \"email\" : \"test@example.com\",\n\
                    \  \"nickname\" : \"테스터\"\n}"
  /api/v1/custom-games/rooms:
    get:
      tags:
      - Custom Game
      summary: 사용자 지정 공개 대기실 목록
      description: |
        모든 `WAITING` custom room을 공개 목록으로 조회합니다.

        이 API는 참가 처리를 하지 않습니다.
        사용자가 목록에서 방을 선택하면 후속 join API가 실제 참가 source of truth가 됩니다.
      operationId: custom-room-public-list
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-custom-games-rooms2099217042'
              examples:
                custom-room-public-list:
                  value: "{\n  \"rooms\" : [ {\n    \"roomId\" : 100,\n    \"roomName\"\
                    \ : \"Host's room\",\n    \"inviteCode\" : \"AB12CD\",\n    \"\
                    ownerUserId\" : 1,\n    \"status\" : \"WAITING\",\n    \"maxParticipants\"\
                    \ : 2,\n    \"currentParticipants\" : 1\n  } ]\n}"
    post:
      tags:
      - Custom Game
      summary: 사용자 지정 방 생성
      description: "로그인 사용자의 사용자 지정 방을 생성합니다.\n\n이번 API는 게임 시작이 아니라 대기실 생성 계약입니다.\n\
        생성자는 OWNER participant로 저장되고, 후속 join/start 이슈에서 이 room을 이어받습니다.\n"
      operationId: custom-room-create
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-custom-games-rooms-inviteCode-join-1788760647'
              examples:
                custom-room-create:
                  value: "{\n  \"roomId\" : 100,\n  \"roomName\" : \"Host's room\"\
                    ,\n  \"inviteCode\" : \"AB12CD\",\n  \"ownerUserId\" : 1,\n  \"\
                    status\" : \"WAITING\",\n  \"maxParticipants\" : 2,\n  \"participants\"\
                    \ : [ {\n    \"userId\" : 1,\n    \"nickname\" : \"Host\",\n \
                    \   \"role\" : \"OWNER\"\n  } ]\n}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-custom-games-rooms1570193490'
              examples:
                custom-room-create-active-exists:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 11, 331608000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"CUSTOM_ROOM_007\",\n\
                    \  \"message\" : \"이미 대기 중인 사용자 지정 방이 있습니다.\",\n  \"errors\" :\
                    \ null\n}"
  /api/v1/games/practice:
    post:
      tags:
      - Game
      summary: 연습 게임 시작
      description: "로그인 사용자의 단일 연습 게임을 시작합니다.\n\n연습 모드는 match queue, waiting, RTT\
        \ 흐름을 타지 않습니다.\n이 HTTP 응답은 command ack가 아니라 play 화면 진입에 필요한 handoff 계약입니다\
        .\n결과 확정 source of truth는 이후 `/ws/game/{gameRoomId}`에서 내려오는 `GAME_RESULT`입\
        니다.\n"
      operationId: game-practice-start
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-practice-1889668904'
              examples:
                game-practice-start:
                  value: "{\n  \"gameRoomId\" : 100,\n  \"serverTime\" : 1000,\n \
                    \ \"startAt\" : 5000,\n  \"webSocketUrl\" : \"/ws/game/100\",\n\
                    \  \"scenario\" : {\n    \"starCoreMaxHp\" : 10000,\n    \"durationMs\"\
                    \ : 12000,\n    \"hpTimeline\" : [ {\n      \"timeMs\" : 0,\n\
                    \      \"hp\" : 10000\n    }, {\n      \"timeMs\" : 12000,\n \
                    \     \"hp\" : 0\n    } ]\n  }\n}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-practice1039643107'
              examples:
                game-practice-start-active-room:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 12, 972657000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"GAME_PRACTICE_001\"\
                    ,\n  \"message\" : \"이미 진행 중인 게임이 있습니다.\",\n  \"errors\" : null\n\
                    }"
  /api/v1/match/join:
    post:
      tags:
      - Match
      summary: 매칭 대기열 진입
      description: 사용자가 매칭 대기열에 진입합니다.
      operationId: match-join
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
  /api/v1/match/leave:
    delete:
      tags:
      - Match
      summary: 매칭 대기열 취소
      description: 사용자가 매칭 대기열에서 나갑니다.
      operationId: match-leave
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
  /api/v1/auth/password/reset-request:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 링크 요청
      description: |
        비밀번호 재설정 링크 발송을 요청합니다.

        이 API의 HTTP 200은 요청 접수 ack입니다.
        가입된 이메일이면 reset token을 저장하고 메일 발송을 시도합니다.
        미가입 이메일이거나 메일 발송이 실패해도 이메일 존재 여부를 노출하지 않기 위해 동일한 ack를 반환합니다.
      operationId: auth-password-reset-request
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-password-reset-request-1598584392'
            examples:
              auth-password-reset-request:
                value: "{\n  \"email\" : \"test@example.com\"\n}"
      responses:
        "200":
          description: "200"
          content:
            text/plain;charset=ISO-8859-1:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit486549215'
              examples:
                auth-password-reset-request:
                  value: "??? ??? ???? ???????. (Mock: ?? ?? ??)"
  /api/v1/auth/password/reset-submit:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 제출
      description: |
        메일 링크로 전달받은 token과 새 비밀번호를 사용하여 비밀번호를 변경합니다.

        token은 Redis에 저장된 reset token을 source of truth로 삼습니다.
        변경 성공 후 token은 즉시 삭제되어 재사용할 수 없습니다.
      operationId: auth-password-reset-submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/api-v1-auth-password-reset-submit1164788574'
            examples:
              auth-password-reset-submit:
                value: "{\n  \"token\" : \"valid-token\",\n  \"newPassword\" : \"\
                  newPassword123\"\n}"
              auth-password-reset-submit-invalid-token:
                value: "{\n  \"token\" : \"expired-token\",\n  \"newPassword\" : \"\
                  newPassword123\"\n}"
      responses:
        "200":
          description: "200"
          content:
            text/plain;charset=ISO-8859-1:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit486549215'
              examples:
                auth-password-reset-submit:
                  value: ????? ????? ???????.
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-auth-password-reset-submit-444970371'
              examples:
                auth-password-reset-submit-invalid-token:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 10, 516086000\
                    \ ],\n  \"status\" : 400,\n  \"code\" : \"AUTH_001\",\n  \"message\"\
                    \ : \"유효하지 않거나 만료된 재설정 토큰입니다.\",\n  \"errors\" : null\n}"
  /api/v1/custom-games/rooms/{roomId}:
    get:
      tags:
      - Custom Game
      summary: 사용자 지정 방 상세 조회
      description: |
        roomId로 `WAITING` custom room 상태를 조회합니다.

        roomId에 해당하는 custom room이 없으면 전역 `ErrorResponse` 형식으로 응답합니다.
      operationId: custom-room-detail
      parameters:
      - name: roomId
        in: path
        description: custom room ID
        required: true
        schema:
          type: string
      responses:
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-custom-games-rooms-invites-inviteCode-1580653385'
              examples:
                custom-room-detail-not-found:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 11, 316175000\
                    \ ],\n  \"status\" : 404,\n  \"code\" : \"CUSTOM_ROOM_006\",\n\
                    \  \"message\" : \"사용자 지정 방을 찾을 수 없습니다.\",\n  \"errors\" : null\n\
                    }"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-custom-games-rooms-inviteCode-join-1788760647'
              examples:
                custom-room-detail:
                  value: "{\n  \"roomId\" : 100,\n  \"roomName\" : \"Host's room\"\
                    ,\n  \"inviteCode\" : \"AB12CD\",\n  \"ownerUserId\" : 1,\n  \"\
                    status\" : \"WAITING\",\n  \"maxParticipants\" : 2,\n  \"participants\"\
                    \ : [ {\n    \"userId\" : 1,\n    \"nickname\" : \"Host\",\n \
                    \   \"role\" : \"OWNER\"\n  } ]\n}"
  /api/v1/games/{gameId}/summary:
    get:
      tags:
      - Game
      summary: 게임 결과 summary 조회 - PENDING
      description: "`GAME_RESULT` WebSocket 수신 후 최종 결과 화면에서 호출하는 조회 API입니다.\n\ngameRoom은\
        \ `FINISHED`지만 record/rank 정산 record가 아직 0행 또는 1행이면 `PENDING`을 반환합니다.\n서버는\
        \ 이 API에서 정산을 새로 수행하지 않고, 클라이언트는 `retryAfterMillis` 기준으로 짧게 polling합니다.\n"
      operationId: game-summary-
      parameters:
      - name: gameId
        in: path
        description: 게임 ID. 현재 구현에서는 gameRoomId와 동일
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary104297999'
              examples:
                game-summary-pending:
                  value: "{\n  \"summaryStatus\" : \"PENDING\",\n  \"gameId\" : 100,\n\
                    \  \"retryAfterMillis\" : 1000\n}"
                game-summary-done:
                  value: "{\n  \"summaryStatus\" : \"DONE\",\n  \"gameId\" : 100,\n\
                    \  \"gameResult\" : \"PLAYER1_WIN\",\n  \"winnerUserId\" : 1,\n\
                    \  \"finishedAt\" : \"2026-05-27T12:34:56\",\n  \"me\" : {\n \
                    \   \"userId\" : 1,\n    \"nickname\" : \"moon\",\n    \"result\"\
                    \ : \"WIN\",\n    \"lpBefore\" : 40,\n    \"lpAfter\" : 56,\n\
                    \    \"lpChange\" : 16,\n    \"rankBefore\" : \"GOLD_IV\",\n \
                    \   \"rankAfter\" : \"GOLD_III\",\n    \"seriesType\" : \"RANK\"\
                    ,\n    \"rankSeriesId\" : null\n  },\n  \"opponent\" : {\n   \
                    \ \"userId\" : 2,\n    \"nickname\" : \"other\",\n    \"result\"\
                    \ : \"LOSS\",\n    \"lpBefore\" : 61,\n    \"lpAfter\" : 45,\n\
                    \    \"lpChange\" : -16,\n    \"rankBefore\" : \"GOLD_IV\",\n\
                    \    \"rankAfter\" : \"GOLD_IV\",\n    \"seriesType\" : \"RANK\"\
                    ,\n    \"rankSeriesId\" : null\n  }\n}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary166921680'
              examples:
                game-summary-not-found:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 13, 496198000\
                    \ ],\n  \"status\" : 404,\n  \"code\" : \"GAME_005\",\n  \"message\"\
                    \ : \"게임방을 찾을 수 없습니다.\",\n  \"errors\" : null\n}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary166921680'
              examples:
                game-summary-not-finished:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 13, 546500000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"GAME_SUMMARY_001\",\n\
                    \  \"message\" : \"종료된 게임의 결과만 조회할 수 있습니다.\",\n  \"errors\" :\
                    \ null\n}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-games-gameId-summary166921680'
              examples:
                game-summary-forbidden:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 13, 532820000\
                    \ ],\n  \"status\" : 403,\n  \"code\" : \"AUTH_002\",\n  \"message\"\
                    \ : \"해당 리소스에 대한 접근 권한이 없습니다.\",\n  \"errors\" : null\n}"
  /api/v1/match/{matchId}/accept:
    post:
      tags:
      - Match
      summary: 매칭 수락 실패
      description: "매칭 수락 요청이 이미 완료/거절/timeout된 세션에 도착한 경우 기존 전역 `ErrorResponse`를\
        \ 반환합니다.\n실패 응답은 최종 정산 이벤트가 아니며, `MATCH_012` lock 실패만 모달 유지 후 SSE 최종 결과 대기\
        로 처리합니다.\n그 외 매칭 응답 실패는 start 버튼 화면 복귀 기준으로 처리합니다.\n\n주요 실패 코드:\n- `MATCH_006`:\
        \ 세션 없음 또는 만료\n- `MATCH_007`: 세션 참여자 아님\n- `MATCH_008`: 이미 수락한 유저가 거절 시도\n\
        - `MATCH_009`: 이미 완료된 세션\n- `MATCH_010`: 이미 거절된 세션\n- `MATCH_011`: 이미 timeout\
        \ 정산된 세션\n- `MATCH_012`: 같은 matchId 응답 처리 중\n"
      operationId: match-accept
      parameters:
      - name: matchId
        in: path
        description: 매칭 세션 ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-match-matchId-accept1897412631'
              examples:
                match-accept-failure:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 14, 433686000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"MATCH_011\",\n  \"message\"\
                    \ : \"이미 응답 시간이 초과된 매칭입니다.\",\n  \"errors\" : null\n}"
        "200":
          description: "200"
  /api/v1/match/{matchId}/reject:
    post:
      tags:
      - Match
      summary: 매칭 거절
      description: "매칭 성사 후 제한 시간 안에 매칭을 거절합니다.\n\n성공 응답은 `200 OK` empty body이며, 사\
        용자의 거절 요청이 서버에 반영되었다는 command ack만 의미합니다.\n한쪽이 먼저 거절해도 상대방의 응답 윈도우는 유지되고,\
        \ 거절한 유저도 최종 `match_response_result` SSE 이벤트를 기다립니다.\n"
      operationId: match-reject
      parameters:
      - name: matchId
        in: path
        description: 매칭 세션 ID
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api-v1-match-matchId-accept1897412631'
              examples:
                match-reject-failure:
                  value: "{\n  \"timestamp\" : [ 2026, 6, 25, 14, 26, 14, 404566000\
                    \ ],\n  \"status\" : 409,\n  \"code\" : \"MATCH_008\",\n  \"message\"\
                    \ : \"이미 수락한 매칭입니다.\",\n  \"errors\" : null\n}"
  /api/v1/notifications/match/stream:
    get:
      tags:
      - Notification
      summary: 매칭 알림 SSE 연결
      description: "매칭 대기 화면에서 매칭 성사와 매칭 응답 최종 결과를 받기 위한 SSE 스트림을 연결합니다.\n\n클라이언트는\
        \ 매칭 시작 화면 진입 시 SSE를 연결하고, `match_found` 수신 후에도 같은 연결을 유지합니다.\naccept/reject\
        \ HTTP 응답은 command ack만 의미하며, 최종 화면 전환은 `match_response_result` 이벤트를 기준으로\
        \ 처리합니다.\n\n## event: match_found\n\n매칭이 성사되어 수락/거절 모달을 띄워야 할 때 전송합니다.\n\n\
        ## event: match_response_result\n\nmatchId 단위 최종 결과 이벤트입니다. 상대의 개별 응답 로그가\
        \ 아니라 최종 성공/실패 결과만 전달합니다.\n\nPayload:\n- `matchId`: 매칭 세션 ID\n- `outcome`:\
        \ `MATCHED`, `FAILED`\n- `reason`: `BOTH_ACCEPTED`, `MY_REJECTED`, `OPPONENT_REJECTED`,\
        \ `MY_TIMEOUT`, `OPPONENT_TIMEOUT`, `BOTH_TIMEOUT`, `GAME_SETUP_FAILED`\n\
        - `action`: `GO_TO_GAME_WAITING`, `GO_TO_MATCH_START`, `RETURN_TO_MATCHING`\n\
        - `opponent`: 상대 `userId`, `nickname`, `tier`, `tierScore`\n- `game`: 성공 시\
        \ 게임 대기 화면 진입 payload, 실패 시 `null`\n- `game.gameRoomId`: 생성된 게임방 ID\n- `game.webSocketUrl`:\
        \ gameRoom WebSocket URL. MVP 기본 형식은 `/ws/game/{gameRoomId}`\n\nAction mapping:\n\
        - `GO_TO_GAME_WAITING`: `game` payload를 사용해 게임 진행 대기 화면으로 이동\n- `GO_TO_MATCH_START`:\
        \ 매칭 start 버튼 화면으로 복귀\n- `RETURN_TO_MATCHING`: 기존 우선순위로 매칭 대기 상태 복귀\n\nResult\
        \ mapping:\n- `MATCHED / BOTH_ACCEPTED / GO_TO_GAME_WAITING / game={gameRoomId,\
        \ webSocketUrl}`\n- `FAILED / MY_REJECTED / GO_TO_MATCH_START`\n- `FAILED\
        \ / OPPONENT_REJECTED / RETURN_TO_MATCHING`\n- `FAILED / MY_TIMEOUT / GO_TO_MATCH_START`\n\
        - `FAILED / OPPONENT_TIMEOUT / RETURN_TO_MATCHING`\n- `FAILED / BOTH_TIMEOUT\
        \ / GO_TO_MATCH_START`\n- `FAILED / GAME_SETUP_FAILED / GO_TO_MATCH_START`\n"
      operationId: notification-match-stream
      parameters:
      - name: Authorization
        in: header
        description: 액세스 토큰 (Bearer)
        required: true
        schema:
          type: string
        example: Bearer access-token
      responses:
        "200":
          description: "200"
