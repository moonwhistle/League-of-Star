<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 1.4; }
      .panel-strong { fill: #f8fcff; stroke: #5f9dea; stroke-width: 2.2; }
      .title { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 48px; font-weight: 800; fill: #18202f; }
      .subtitle { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 24px; font-weight: 500; fill: #596274; }
      .h2 { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 30px; font-weight: 800; fill: #18202f; }
      .h3 { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 24px; font-weight: 800; fill: #18202f; }
      .body { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 22px; font-weight: 500; fill: #333b49; }
      .small { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 18px; font-weight: 500; fill: #667085; }
      .tiny { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 16px; font-weight: 500; fill: #798293; }
      .value { font-family: "Segoe UI", "Pretendard", sans-serif; font-size: 28px; font-weight: 800; fill: #111827; }
      .good { fill: #14805e; }
      .bad { fill: #c2410c; }
      .blue { fill: #3f7ee8; }
      .green { fill: #21a67a; }
      .line { stroke: #d9dee8; stroke-width: 1.4; }
      .axis { stroke: #c7cedb; stroke-width: 1.4; }
      .muted-line { stroke: #e5e9f1; stroke-width: 1.2; }
      .arrow { stroke: #8d98aa; stroke-width: 3; marker-end: url(#arrowhead); }
      .chip { fill: #eef5ff; stroke: #b8d4fb; stroke-width: 1.2; }
      .chip-text { font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; fill: #285eaa; }
      .code { font-family: "JetBrains Mono", "Consolas", monospace; font-size: 19px; font-weight: 600; fill: #243044; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8d98aa"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <text class="title" x="80" y="92">랭킹 조회 N+1 최적화</text>
  <text class="subtitle" x="80" y="132">row별 user 단건 조회를 batch 조회로 변경해 SQL 호출 수와 API 응답 시간을 감소</text>

  <rect class="panel-strong" x="1060" y="60" width="460" height="116" rx="14"/>
  <text class="h3" x="1090" y="108">핵심 개선</text>
  <text class="body" x="1090" y="144">findById 반복 호출 → findByIds 1회 조회</text>

  <rect class="panel" x="80" y="210" width="690" height="330" rx="18"/>
  <text class="h2" x="120" y="263">개선 전</text>
  <rect class="chip" x="120" y="285" width="170" height="38" rx="19"/>
  <text class="chip-text" x="145" y="311">1 + N 구조</text>

  <text class="body" x="120" y="365">랭킹 row 조회</text>
  <line class="arrow" x1="285" y1="358" x2="375" y2="358"/>
  <text class="body" x="400" y="365">row마다 users 단건 조회</text>
  <text class="code" x="120" y="420">rank query 1회 + users query 50회</text>
  <text class="code" x="120" y="458">= 총 55회 수준의 SQL 실행</text>
  <text class="small" x="120" y="500">limit=50 기준, 닉네임 조립 과정에서 반복 조회 발생</text>

  <rect class="panel" x="830" y="210" width="690" height="330" rx="18"/>
  <text class="h2" x="870" y="263">개선 후</text>
  <rect class="chip" x="870" y="285" width="190" height="38" rx="19"/>
  <text class="chip-text" x="895" y="311">Batch 조회</text>

  <text class="body" x="870" y="365">userId 수집</text>
  <line class="arrow" x1="1005" y1="358" x2="1095" y2="358"/>
  <text class="body" x="1120" y="365">users IN query 1회</text>
  <text class="code" x="870" y="420">rank query 1회 + users IN query 1회</text>
  <text class="code" x="870" y="458">= 총 6회 수준의 SQL 실행</text>
  <text class="small" x="870" y="500">조회한 users를 Map으로 변환해 응답 조립</text>

  <rect class="panel" x="80" y="590" width="690" height="300" rx="18"/>
  <text class="h2" x="120" y="642">SQL 실행 횟수</text>
  <text class="small" x="120" y="672">Hibernate Statistics 기준, 낮을수록 좋음</text>

  <line class="axis" x1="220" y1="820" x2="640" y2="820"/>
  <line class="axis" x1="220" y1="710" x2="220" y2="820"/>
  <text class="small" transform="translate(145 795) rotate(-90)">SQL 실행 횟수</text>
  <text class="small" x="360" y="870">조회 방식</text>

  <rect class="blue" x="300" y="710" width="90" height="110" rx="8"/>
  <text class="value bad" x="320" y="698">55</text>
  <text class="small" x="285" y="848">개선 전</text>

  <rect class="green" x="480" y="808" width="90" height="12" rx="6"/>
  <text class="value good" x="502" y="792">6</text>
  <text class="small" x="472" y="848">개선 후</text>

  <rect class="panel" x="830" y="590" width="690" height="300" rx="18"/>
  <text class="h2" x="870" y="642">API 응답 시간</text>
  <text class="small" x="870" y="672">k6 단일 VU 30회 반복 측정 p95, 낮을수록 좋음</text>

  <line class="axis" x1="970" y1="820" x2="1390" y2="820"/>
  <line class="axis" x1="970" y1="710" x2="970" y2="820"/>
  <text class="small" transform="translate(848 800) rotate(-90)">p95 응답 시간(ms)</text>
  <text class="small" x="1115" y="870">조회 방식</text>

  <rect class="blue" x="1050" y="710" width="90" height="110" rx="8"/>
  <text class="value bad" x="1028" y="698">139.97ms</text>
  <text class="small" x="1035" y="848">개선 전</text>

  <rect class="green" x="1230" y="755" width="90" height="65" rx="8"/>
  <text class="value good" x="1215" y="742">82.67ms</text>
  <text class="small" x="1222" y="848">개선 후</text>

  <rect class="panel" x="80" y="920" width="1440" height="52" rx="14"/>
  <text class="body" x="120" y="953">N+1 제거로 SQL 실행 횟수는 55회 → 6회, API p95는 139.97ms → 82.67ms로 약 40.9% 감소했다.</text>
</svg>
