name: 이슈 브랜치 및 Draft PR 자동 생성

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-branch-and-pr:
    # 조건을 훨씬 단순화했습니다. feat 또는 refactor가 포함되면 실행됩니다.
    if: >-
      contains(github.event.issue.labels.*.name, 'feat') || 
      contains(github.event.issue.labels.*.name, 'FEAT') ||
      contains(github.event.issue.labels.*.name, 'feature') ||
      contains(github.event.issue.labels.*.name, 'refactor') ||
      contains(github.event.issue.labels.*.name, 'REFACTOR')
    runs-on: ubuntu-latest

    steps:
      - name: 기본 브랜치 체크아웃
        uses: actions/checkout@v4

      - name: 브랜치 이름 생성
        id: branch
        shell: bash
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          
          # 라벨들을 콤마로 연결해 하나의 문자열로 변환
          ALL_LABELS=$(echo '${{ toJson(github.event.issue.labels.*.name) }}' | tr -d '[]" ')

          # 우선순위에 따라 접두어 결정
          if [[ "$ALL_LABELS" =~ "refactor" ]] || [[ "$ALL_LABELS" =~ "REFACTOR" ]]; then
            PREFIX="refactor"
          else
            PREFIX="feat"
          fi

          # 제목 슬러그화
          SLUG="$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-{2,}/-/g' \
            | cut -c1-30)"
          
          if [ -z "$SLUG" ]; then SLUG="work"; fi

          BRANCH_NAME="#${ISSUE_NUMBER}/${PREFIX}-${SLUG}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: 원격 브랜치 생성
        id: create_branch
        shell: bash
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch already exists."
            exit 0
          fi

          git checkout -b "$BRANCH_NAME"
          git commit --allow-empty -m "chore: 이슈 #${{ github.event.issue.number }} 작업 시작"
          git push origin "$BRANCH_NAME"

      - name: Draft PR 생성
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const branchName = process.env.BRANCH_NAME;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const existingPrs = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branchName}`, state: 'open'
            });

            if (existingPrs.data.length > 0) return;

            const prBody = `## 📌 자동 생성된 PR\n\n- 연결된 이슈: #${issue.number}\n\n이 PR은 작업을 시작함과 동시에 자동으로 생성되었습니다.`;
            
            const { data: pr } = await github.rest.pulls.create({
              owner, repo,
              title: `#${issue.number} ${issue.title}`,
              head: branchName,
              base: context.payload.repository.default_branch,
              body: prBody,
              draft: true,
            });

            if (issue.labels.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number,
                labels: issue.labels.map(l => l.name)
              });
            }
            if (issue.assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: pr.number,
                assignees: issue.assignees.map(a => a.login)
              });
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `🚀 작업 브랜치와 Draft PR이 생성되었습니다!\n\n- Branch: \`${branchName}\` \n- PR: #${pr.number}`
            });
