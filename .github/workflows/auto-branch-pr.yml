name: 이슈 브랜치 및 Draft PR 자동 생성

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  create-branch-and-pr:
    if: >-
      contains(github.event.issue.labels.*.name, 'feat') || 
      contains(github.event.issue.labels.*.name, 'FEAT') ||
      contains(github.event.issue.labels.*.name, 'feature') ||
      contains(github.event.issue.labels.*.name, 'refactor') ||
      contains(github.event.issue.labels.*.name, 'REFACTOR')
    runs-on: ubuntu-latest

    steps:
      - name: 기본 브랜치 체크아웃
        uses: actions/checkout@v4

      - name: 브랜치 이름 생성
        id: branch
        shell: bash
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ALL_LABELS=$(echo '${{ toJson(github.event.issue.labels.*.name) }}' | tr -d '[]" ')

          if [[ "$ALL_LABELS" =~ "refactor" ]] || [[ "$ALL_LABELS" =~ "REFACTOR" ]]; then
            PREFIX="refactor"
          else
            PREFIX="feat"
          fi

          BRANCH_NAME="${PREFIX}/#${ISSUE_NUMBER}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: 원격 브랜치 생성
        id: create_branch
        shell: bash
        run: |
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "Branch already exists."
            exit 0
          fi

          git checkout -b "$BRANCH_NAME"
          git commit --allow-empty -m "chore: 이슈 #${{ github.event.issue.number }} 작업 시작"
          git push origin "$BRANCH_NAME"

      - name: Draft PR 생성
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;
            const branchName = process.env.BRANCH_NAME;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 이미 해당 브랜치로 PR이 존재하면 스킵
            const { data: existingPRs } = await github.rest.pulls.list({
              owner, repo, head: `${owner}:${branchName}`, state: 'open'
            });
            if (existingPRs.length > 0) {
              console.log(`PR already exists: #${existingPRs[0].number}. Skipping.`);
              return;
            }

            let prTemplate = '## 📌 요약\n\n## 📚 변경 사항\n\n## 📝 참고 사항\n\n## 📌 관련 이슈\n- Closes #' + issue.number;
            try {
              const templatePath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'PULL_REQUEST_TEMPLATE.md');
              if (fs.existsSync(templatePath)) {
                prTemplate = fs.readFileSync(templatePath, 'utf8').replace('Closes #', `Closes #${issue.number}`);
              }
            } catch (error) {
              console.log('Template read error:', error);
            }

            const prBody = [
              '## 🛠 자동 생성된 Draft PR',
              '',
              '연결된 이슈를 기준으로 자동 생성된 PR입니다.',
              '',
              '### 📌 브랜치',
              `- \`${branchName}\``,
              '',
              '---',
              '',
              prTemplate.trim(),
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner, repo,
              title: `#${issue.number} ${issue.title}`,
              head: branchName,
              base: context.payload.repository.default_branch,
              body: prBody,
              draft: true,
            });

            if (issue.labels.length > 0) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number,
                labels: issue.labels.map(l => l.name)
              });
            }
            if (issue.assignees.length > 0) {
              await github.rest.issues.addAssignees({
                owner, repo, issue_number: pr.number,
                assignees: issue.assignees.map(a => a.login)
              });
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: `🚀 작업 브랜치와 Draft PR이 성공적으로 생성되었습니다!\n\n- **Branch**: \`${branchName}\` \n- **PR**: #${pr.number}`
            });
