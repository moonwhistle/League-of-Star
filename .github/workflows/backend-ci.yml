name: Backend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/local/**'
      - 'infra/prod/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run actionlint
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:1.7.7

  compose-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate local infrastructure compose
        run: docker compose -f infra/local/docker-compose-infra.yml config --quiet

      - name: Validate local app compose
        run: docker compose -f infra/local/docker-compose-app.yml config --quiet

      - name: Validate local monitoring compose
        run: docker compose -f infra/local/docker-compose-monitoring.yml config --quiet

      - name: Validate production compose
        env:
          HTTP_PORT: 8088
          PUBLIC_API_URL: http://localhost:8088
          FRONTEND_URL: http://localhost:3000
          MYSQL_DATABASE: league_of_star
          MYSQL_USER: league_of_star
          MYSQL_PASSWORD: dummy-mysql-password
          MYSQL_ROOT_PASSWORD: dummy-root-password
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          REDIS_PASSWORD: dummy-redis-password
          JWT_SECRET: dummy-jwt-secret-dummy-jwt-secret-dummy-jwt-secret
          JWT_ACCESS_TOKEN_EXPIRATION_MS: 3600000
          JWT_REFRESH_TOKEN_EXPIRATION_MS: 604800000
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret
          MAIL_HOST: smtp.gmail.com
          MAIL_PORT: 587
          MAIL_USERNAME: dummy@example.com
          MAIL_PASSWORD: dummy-mail-password
        run: docker compose -f infra/prod/compose.yml config --quiet

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run backend build
        run: ./gradlew build --build-cache --parallel

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/build/test-results/test/**
            backend/**/build/reports/tests/test/**
          if-no-files-found: ignore
